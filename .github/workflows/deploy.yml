name: Build, Push & Deploy to OKE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout Terraform-code repo (this repo) ─────────────────────────
      - name: Checkout Terraform-code
        uses: actions/checkout@v4
        with:
          path: terraform-code

      # ─── 3. Install OCI CLI ─────────────────────────────────────────────────
      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      # ─── 4. Configure OCI CLI ─────────────────────────────────────────────────
      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ vars.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF

      # ─── 7. Install kubectl & Helm ───────────────────────────────────────────
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.14.0'

      # ─── 8. Generate kubeconfig via OCI CLI ──────────────────────────────────
      - name: Generate kubeconfig
        run: |
          mkdir -p ~/.kube
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ secrets.CLUSTER_OCID }} \
            --file ~/.kube/config \
            --region ${{ vars.OCI_REGION }} \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT

      # ─── 9. Create / Update Kubernetes Secrets ───────────────────────────────
      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ vars.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create OCIR pull secret
        run: |
          kubectl create secret docker-registry ocir-secret \
            --docker-server=${{ vars.OCIR_REGISTRY }} \
            --docker-username="${{ vars.TENANCY_NAMESPACE }}/${{ secrets.OCI_IDENTITY_DOMAIN }}/${{ secrets.OCI_USER_EMAIL }}" \
            --docker-password="${{ secrets.OCIR_AUTH_TOKEN }}" \
            --docker-email="${{ secrets.OCI_USER_EMAIL }}" \
            -n ${{ vars.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create app-secrets in Kubernetes
        run: |
          kubectl create secret generic app-secrets \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            --from-literal=ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
            --from-literal=ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            -n ${{ vars.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # ─── 10. Install ArgoCD ───────────────────────────────────────────────────
      - name: Install ArgoCD
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

      # ─── 11. Wait for ArgoCD server ───────────────────────────────────────────
      - name: Wait for ArgoCD server
        run: |
          kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=300s

      # ─── 12. Apply ArgoCD Config ──────────────────────────────────────────────
      - name: Apply ArgoCD Config
        run: |
          kubectl apply -f terraform-code/argocd/ecommerce-app.yaml
