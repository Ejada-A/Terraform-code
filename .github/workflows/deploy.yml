name: Deploy Infrastructure and Applications

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Provision & Deploy
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout Terraform-code repo ─────────────────────────
      - name: Checkout Terraform-code
        uses: actions/checkout@v4

      # ─── 2. Setup Terraform ───────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      # ─── 3. Configure OCI CLI for Terraform ───────────────────────
      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ vars.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF

      # ─── 4. Terraform Init and Apply ──────────────────────────────
      - name: Terraform Init and Apply
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ~/.oci/oci_api_key.pem
          TF_VAR_region: ${{ vars.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_github_token: ${{ secrets.GH_PAT }}
          TF_VAR_github_owner: ${{ vars.GH_OWNER }}
          TF_VAR_github_repo: ${{ vars.TERRAFORM_REPO }}
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
          AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
        run: |
          terraform init
          terraform apply -auto-approve

      # ─── 5. Extract Terraform Outputs ─────────────────────────────
      - name: Extract Terraform Outputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
        run: |
          CLUSTER_ID=$(terraform output -raw cluster_id)
          echo "CLUSTER_OCID=$CLUSTER_ID" >> $GITHUB_ENV
          
          LB_SUBNET_ID=$(terraform output -raw load_balancer_subnet_id)
          LB_NSG_ID=$(terraform output -raw load_balancer_nsg_id)
          echo "LB_NSG_ID=$LB_NSG_ID" >> $GITHUB_ENV
          echo "LB_SUBNET_ID=$LB_SUBNET_ID" >> $GITHUB_ENV

      # ─── 6. Install OCI CLI ───────────────────────────────────────
      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      # ─── 7. Install kubectl & Helm ────────────────────────────────
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.14.0'

      # ─── 8. Generate kubeconfig via OCI CLI ───────────────────────
      - name: Generate kubeconfig
        run: |
          mkdir -p ~/.kube
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ env.CLUSTER_OCID }} \
            --file ~/.kube/config \
            --region ${{ vars.OCI_REGION }} \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          chmod 600 ~/.kube/config

      # ─── 9. Export Kubeconfig as Artifact ─────────────────────────
      - name: Upload Kubeconfig
        uses: actions/upload-artifact@v4
        with:
          name: kubeconfig
          path: ~/.kube/config

      # ─── 9.5. Install NGINX & Cert-Manager ────────────────────────
      - name: Install NGINX Ingress Controller
        run: |
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          
          HELM_CMD="helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx --create-namespace \
            --set controller.service.annotations.\"service\.beta\.kubernetes\.io/oci-load-balancer-subnet1\"=${{ env.LB_SUBNET_ID }} \
            --set controller.service.annotations.\"oci\.oraclecloud\.com/oci-load-balancer-shape\"=\"flexible\" \
            --set controller.service.annotations.\"oci\.oraclecloud\.com/oci-load-balancer-shape-flex-min\"=\"10\" \
            --set controller.service.annotations.\"oci\.oraclecloud\.com/oci-load-balancer-shape-flex-max\"=\"100\" \
            --set controller.service.annotations.\"oci\.oraclecloud\.com/oci-network-security-groups\"=${{ env.LB_NSG_ID }} \
            --set controller.service.annotations.\"oci\.oraclecloud\.com/security-rule-management-mode\"=\"None\""
            
          # Only attach the Reserved IP if it is defined in GitHub Variables
          if [ -n "${{ vars.RESERVED_PUBLIC_IP }}" ]; then
            HELM_CMD="$HELM_CMD --set controller.service.loadBalancerIP=${{ vars.RESERVED_PUBLIC_IP }}"
          fi
          
          eval $HELM_CMD

      - name: Install cert-manager
        run: |
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --set crds.enabled=true

      - name: Configure Let's Encrypt ClusterIssuer
        run: |
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          kubectl wait --for=condition=available deployment/cert-manager-webhook -n cert-manager --timeout=300s
          cat <<EOF | kubectl apply -f -
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-prod
          spec:
            acme:
              email: ${{ secrets.ADMIN_EMAIL }}
              server: https://acme-v02.api.letsencrypt.org/directory
              privateKeySecretRef:
                name: letsencrypt-prod-account-key
              solvers:
              - http01:
                  ingress:
                    class: nginx
          EOF

      - name: Install Metrics Server
        run: |
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

      # ─── 10. Create Kubernetes Secrets ────────────────────────────
      - name: Create namespace if not exists
        run: |
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          kubectl create namespace ${{ vars.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create OCIR pull secret
        run: |
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          kubectl create secret docker-registry ocir-secret \
            --docker-server=jed.ocir.io \
            --docker-username="${{ secrets.OCI_OCIR_USERNAME }}" \
            --docker-password="${{ secrets.OCI_AUTH_TOKEN }}" \
            -n ${{ vars.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create app-secrets in Kubernetes
        run: |
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          kubectl create secret generic app-secrets \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            --from-literal=ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
            --from-literal=ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            -n ${{ vars.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # ─── 11. Install ArgoCD ───────────────────────────────────────
      - name: Install ArgoCD
        run: |
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml --server-side=true --force-conflicts

      # ─── 12. Wait for ArgoCD server ───────────────────────────────
      - name: Wait for ArgoCD server
        run: |
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=300s

      # ─── 13. Apply ArgoCD Config (Deploys App & Ingress) ─────────────
      - name: Apply ArgoCD Config
        run: |
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          kubectl apply -f argocd/ecommerce-app.yaml
          kubectl apply -f argocd/argocd-ingress.yaml
