apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ecommUi.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.ecommUi.name }}
    {{- include "ecommerce-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ecommUi.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.ecommUi.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.ecommUi.name }}
    spec:
      {{- if .Values.global.imagePullSecretName }}
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecretName }}
      {{- end }}
      containers:
      - name: {{ .Values.ecommUi.name }}
        image: "{{ .Values.ecommUi.image.repository }}:{{ .Values.ecommUi.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.ecommUi.port }}
          name: http
        env:
        - name: PORT
          value: "{{ .Values.ecommUi.port }}"
        - name: MONGODB_URI
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGODB_URI
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: AUTH_SERVICE_URL
        - name: PRODUCT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PRODUCT_SERVICE_URL
        - name: ORDER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ORDER_SERVICE_URL
        - name: PAYMENT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PAYMENT_SERVICE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: STRIPE_SECRET_KEY
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ADMIN_EMAIL
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ADMIN_PASSWORD
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.ecommUi.port }}
          initialDelaySeconds: 40
          periodSeconds: 20
          timeoutSeconds: 15
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.ecommUi.port }}
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          {{- toYaml .Values.ecommUi.resources | nindent 10 }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.ecommUi.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.ecommUi.name }}
  {{- if .Values.ecommUi.service.annotations }}
  annotations:
    {{- toYaml .Values.ecommUi.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ecommUi.service.type }}
  {{- if .Values.ecommUi.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.ecommUi.service.loadBalancerIP }}
  {{- end }}
  selector:
    app: {{ .Values.ecommUi.name }}
  ports:
  - port: 80
    targetPort: {{ .Values.ecommUi.port }}
    name: http
