apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
  namespace: ecommerce-ns
  labels:
    app: products-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: products-service
  template:
    metadata:
      labels:
        app: products-service
    spec:
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: products-service
        image: jed.ocir.io/axkjllkftxfz/shared-group-a-cmp/products-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5002
          name: http
        env:
        - name: PORT
          value: "5002"
        - name: MONGODB_URI
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGODB_URI
        livenessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: products-service
  namespace: ecommerce-ns
  labels:
    app: products-service
spec:
  type: ClusterIP
  selector:
    app: products-service
  ports:
  - port: 5002
    targetPort: 5002
    name: http
